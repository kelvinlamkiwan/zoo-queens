<script>
'use strict';
/* ════════════════════════════════════════════════════════════════
   Zoo Queens 動物園皇后 — Queens / Star Battle 邏輯謎題
   N×N 棋盤 → N 個彩色區域，每區/每行/每列一隻動物，8 方向不相鄰。
   自訂動物圖：放 animal.png 喺同 index.html 同一資料夾即自動套用。
   ════════════════════════════════════════════════════════════════ */

// ── Config ──
const PALETTE = [
  '#4a90d9','#4caf50','#f5a623','#9b59b6',
  '#e91e63','#00bcd4','#e74c3c','#f1c40f',
  '#8bc34a','#ff7043','#3f51b5','#00c853',
];
const MAX_ATTEMPTS = 4000;
const NODE_LIMIT = 200000;
const START_HEARTS = 3;
const ANIMAL_IMG = 'animal.png';   // 自訂動物圖（可換成 animal.svg 並改呢行）

// ── 3D 模式（level >= 21 用 Three.js 渲染）──
const THREE_D_LEVEL = 21;
const DIFF_ANIMAL_LEVEL = 15;   // Level >= 15：2D 用唔同動物（Kenney 輪替）
const CUBE_LEVEL = 25;          // Level >= 25：3D 用六面 cube 視覺
const ANIMALS_3D = ['elephant','giraffe','hippo','monkey','panda','parrot','penguin','pig','rabbit','snake'];

function nForLevel(level) { return Math.min(4 + (level - 1), 12); }
function startersFor(N) { return N <= 6 ? 1 : (N <= 9 ? 2 : 3); }
function difficultyFor(N) { return N <= 5 ? 'Easy' : N <= 8 ? 'Normal' : 'Hard'; }
const DIFF_COLOR = { Easy: '#4caf50', Normal: '#f5a623', Hard: '#e5484d' };

// ── State ──
let level = 1;
let N = 4;
let regionOf = [], regionCells = [], solution = [], starters = [];
let board = [], locked = [];
let hearts = START_HEARTS, history = [], animalMode = false;
let score = 0, best = +(localStorage.getItem('zooqueens-best') || 0);
let hintCell = null, hintTimer = null;
let seconds = 0, timerInt = null, started = false;
let g3d = null, g3dFailed = false, pendingPop3D = null, animalIdx3D = 0, baseY3D = 0;
let cubeN = 4, cubeFaces = [], cubeHistory = [], hardMode = false;

// ── 工具 ──
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function key(r, c) { return r + ',' + c; }

/* ════════════════════════════════════════════════════════════════
   解法種子 —— 一個合法嘅動物擺位（每行每列一隻、8 方向不相鄰）
   ════════════════════════════════════════════════════════════════ */
function genPlacement(n) {
  const cols = new Set(); const placed = [];
  function bt(row) {
    if (row === n) return true;
    for (let c = 0; c < n; c++) {
      if (cols.has(c)) continue;
      let ok = true;
      for (const [pr, pc] of placed) if (Math.abs(pr - row) <= 1 && Math.abs(pc - c) <= 1) { ok = false; break; }
      if (!ok) continue;
      cols.add(c); placed.push([row, c]);
      if (bt(row + 1)) return true;
      cols.delete(c); placed.pop();
    }
    return false;
  }
  return bt(0) ? placed : null;
}

/* ════════════════════════════════════════════════════════════════
   區域生成 —— 由解法種子長出（保證連通 + 全覆蓋 + 解有效）。
   揀「最大」相鄰區域（80%）→ 造出不均勻區域 → 逼出唯一解。
   ════════════════════════════════════════════════════════════════ */
function generateRegions(n, seeds) {
  const ro = Array.from({ length: n }, () => Array(n).fill(-1));
  const sizes = Array(n).fill(0);
  for (let i = 0; i < n; i++) { const [r, c] = seeds[i]; ro[r][c] = i; sizes[i] = 1; }

  let filled = n;
  while (filled < n * n) {
    const boundary = [];
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      if (ro[r][c] !== -1) continue;
      const adj = new Set();
      if (r > 0 && ro[r-1][c] >= 0) adj.add(ro[r-1][c]);
      if (r < n-1 && ro[r+1][c] >= 0) adj.add(ro[r+1][c]);
      if (c > 0 && ro[r][c-1] >= 0) adj.add(ro[r][c-1]);
      if (c < n-1 && ro[r][c+1] >= 0) adj.add(ro[r][c+1]);
      if (adj.size) boundary.push({ r, c, adj: [...adj] });
    }
    if (!boundary.length) break;
    const b = boundary[Math.floor(Math.random() * boundary.length)];
    let pick;
    if (Math.random() < 0.8) { pick = b.adj[0]; for (const a of b.adj) if (sizes[a] > sizes[pick]) pick = a; }
    else pick = b.adj[Math.floor(Math.random() * b.adj.length)];
    ro[b.r][b.c] = pick; sizes[pick]++;
    filled++;
  }

  const cells = Array.from({ length: n }, () => []);
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) cells[ro[r][c]].push([r, c]);
  return { regionOf: ro, regionCells: cells };
}

/* ════════════════════════════════════════════════════════════════
   求解器 —— 回溯 + MRV + 前向檢查
   ════════════════════════════════════════════════════════════════ */
function findSolutions(n, ro, cells, fixedSet, forbiddenSet, maxSols, nodeLimit) {
  const solutions = []; let nodes = 0, aborted = false;
  const occ = Array.from({ length: n }, () => Array(n).fill(false));
  const usedRows = new Set(), usedCols = new Set();
  const regionHas = Array(n).fill(false);
  for (const [r, c] of fixedSet) { occ[r][c] = true; usedRows.add(r); usedCols.add(c); regionHas[ro[r][c]] = true; }
  const remaining = [];
  for (let i = 0; i < n; i++) if (!regionHas[i]) remaining.push(i);

  function adj(r, c) {
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < n && nc >= 0 && nc < n && occ[nr][nc]) return true;
    }
    return false;
  }
  function cands(reg) {
    const out = [];
    for (const [r, c] of cells[reg]) {
      if (forbiddenSet.has(key(r, c))) continue;
      if (occ[r][c]) continue;
      if (usedRows.has(r) || usedCols.has(c)) continue;
      if (adj(r, c)) continue;
      out.push([r, c]);
    }
    return out;
  }

  function bt(rem) {
    if (solutions.length >= maxSols || aborted) return;
    if (++nodes > nodeLimit) { aborted = true; return; }
    if (rem.length === 0) {
      const sol = [];
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (occ[r][c]) sol.push([r, c]);
      solutions.push(sol); return;
    }
    let best = -1, bestCands = null;
    for (const reg of rem) {
      const cs = cands(reg);
      if (!cs.length) return;
      if (bestCands === null || cs.length < bestCands.length) { best = reg; bestCands = cs; }
    }
    const rest = rem.filter(x => x !== best);
    for (const [r, c] of bestCands) {
      occ[r][c] = true; usedRows.add(r); usedCols.add(c);
      bt(rest);
      occ[r][c] = false; usedRows.delete(r); usedCols.delete(c);
      if (solutions.length >= maxSols || aborted) return;
    }
  }
  bt(remaining);
  return { solutions, aborted };
}

/* ════════════════════════════════════════════════════════════════
   關卡生成 —— 唯一解保證
   ════════════════════════════════════════════════════════════════ */
function generateLevel(n, starterCount) {
  for (let a = 0; a < MAX_ATTEMPTS; a++) {
    const sol = genPlacement(n);
    if (!sol) continue;
    const { regionOf: ro, regionCells: cells } = generateRegions(n, sol);
    // 規則：size-1（單格）區域最多 1 個（保留 singleton 有助唯一解，只拒絕 2+ 個）
    if (cells.filter(c => c.length === 1).length > 1) continue;
    const r1 = findSolutions(n, ro, cells, [], new Set(), 2, NODE_LIMIT);
    if (r1.aborted || r1.solutions.length !== 1) continue;
    const st = shuffle(sol.slice()).slice(0, starterCount);
    const r2 = findSolutions(n, ro, cells, st, new Set(), 2, NODE_LIMIT);
    if (r2.aborted || r2.solutions.length !== 1) continue;
    return { regionOf: ro, regionCells: cells, solution: sol, starters: st };
  }
  return null;
}

/* ════════════════════════════════════════════════════════════════
   遊戲流程
   ════════════════════════════════════════════════════════════════ */
function loadLevel(lv) {
  const was3D = is3DMode();
  const wasCube = isCubeMode();
  level = lv;
  N = nForLevel(level);
  if (isCubeMode()) {
    if (!generateCubeLevel()) return;
  } else {
    const g = generateLevel(N, 0);
    if (!g) { toast('生成失敗，重試中…'); loadLevel(lv); return; }
    regionOf = g.regionOf; regionCells = g.regionCells; solution = g.solution; starters = g.starters;
    board = Array.from({ length: N }, () => Array(N).fill(0));
    locked = Array.from({ length: N }, () => Array(N).fill(false));
    for (const [r, c] of starters) { board[r][c] = 1; locked[r][c] = true; }
  }
  hearts = START_HEARTS; history = []; cubeHistory = []; hintCell = null; started = false; seconds = 0;
  stopTimer();
  document.getElementById('timer').textContent = '00:00';
  applyModeVisibility();
  if (isCubeMode() && g3d) fitCameraCube();
  else if (is3DMode() && g3d) fitCamera3D();
  hideOverlay(); render();
  if (isCubeMode() && !wasCube) toast('🎉 進入 3D Cube 六面模式！');
  else if (is3DMode() && !was3D) toast('🎉 進入 3D 模式！');
}
function generateCubeLevel() {
  cubeN = Math.min(4 + Math.floor((level - 25) / 3), 6);   // L25→4, L28→5, L31+→6
  if (hardMode) return generateCubeHardLevel();
  cubeFaces = [];
  for (let f = 0; f < 6; f++) {
    let g = null;
    for (let a = 0; a < 30 && !g; a++) g = generateLevel(cubeN, 0);
    if (!g) { toast('六面生成失敗，重試中…'); loadLevel(level); return false; }
    cubeFaces.push({
      regionOf: g.regionOf, regionCells: g.regionCells, solution: g.solution,
      board: Array.from({ length: cubeN }, () => Array(cubeN).fill(0)),
      locked: Array.from({ length: cubeN }, () => Array(cubeN).fill(false)),
    });
  }
  return true;
}
function newGame() { score = 0; loadLevel(1); }
function nextLevel() { loadLevel(level + 1); }
function resetLevel() { loadLevel(level); }

function touch() { if (!started) { started = true; startTimer(); } }
function startTimer() { if (timerInt) return; timerInt = setInterval(() => { seconds++; const m = String(Math.floor(seconds/60)).padStart(2,'0'); const s = String(seconds%60).padStart(2,'0'); document.getElementById('timer').textContent = `${m}:${s}`; }, 1000); }
function stopTimer() { if (timerInt) { clearInterval(timerInt); timerInt = null; } }

function pushHistory() { history.push(board.map(r => r.slice())); if (history.length > 500) history.shift(); }
function undo() {
  if (isCubeMode()) {
    if (!cubeHistory.length) return;
    const prev = cubeHistory.pop();
    cubeFaces.forEach((f, i) => { f.board = prev[i].board; });
    renderCube(); return;
  }
  if (!history.length) return;
  board = history.pop(); render();
}

/* ── 驗證 / 放置 ── */
function rowHasCat(r) { for (let c = 0; c < N; c++) if (board[r][c] === 1) return true; return false; }
function colHasCat(c) { for (let r = 0; r < N; r++) if (board[r][c] === 1) return true; return false; }
function regionHasCat(r, c) { const reg = regionOf[r][c]; for (const [rr, cc] of regionCells[reg]) if (board[rr][cc] === 1) return true; return false; }
function adjacentToCat(r, c) {
  for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
    if (!dr && !dc) continue;
    const nr = r + dr, nc = c + dc;
    if (nr >= 0 && nr < N && nc >= 0 && nc < N && board[nr][nc] === 1) return true;
  }
  return false;
}
function isValidPlacement(r, c) {
  return !(rowHasCat(r) || colHasCat(c) || regionHasCat(r, c) || adjacentToCat(r, c));
}

function placeCat(r, c) {
  if (board[r][c] === 1) return;
  const hadX = board[r][c] === 2;
  if (hadX) board[r][c] = 0;               // clear the ✕ before placing
  if (!isValidPlacement(r, c)) {
    if (hadX) board[r][c] = 2;             // revert ✕ on invalid placement
    shakeCell(r, c); loseHeart(); return;
  }
  pushHistory();
  board[r][c] = 1;
  markPop(r, c);
  render();
  if (isWon()) win();
}
function removeCat(r, c) {
  if (board[r][c] !== 1 || locked[r][c]) return;
  pushHistory(); board[r][c] = 0; render();
}
function toggleX(r, c) {
  pushHistory();
  board[r][c] = board[r][c] === 2 ? 0 : 2;
  render();
}

function loseHeart() {
  hearts--; renderHearts();
  if (hearts <= 0) gameOver();
}
function animalCount() { let c = 0; for (let r = 0; r < N; r++) for (let k = 0; k < N; k++) if (board[r][k] === 1) c++; return c; }
function isWon() { return animalCount() === N; }

/* ── 提示 ── */
function findLocalForced() {
  const cands = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    if (board[r][c] !== 0 || locked[r][c]) continue;
    if (rowHasCat(r) || colHasCat(c) || regionHasCat(r, c) || adjacentToCat(r, c)) continue;
    cands.push([r, c]);
  }
  for (const [r, c] of cands) {
    const rowN = cands.filter(x => x[0] === r).length;
    const colN = cands.filter(x => x[1] === c).length;
    const reg = regionOf[r][c];
    const regN = cands.filter(x => regionOf[x[0]][x[1]] === reg).length;
    if (rowN === 1 || colN === 1 || regN === 1) return [r, c];
  }
  return null;
}
function hint() {
  touch();
  let target = findLocalForced();
  if (!target) {
    const fixed = [], forbidden = new Set();
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      if (board[r][c] === 1) fixed.push([r, c]);
      else if (board[r][c] === 2) forbidden.add(key(r, c));
    }
    const r = findSolutions(N, regionOf, regionCells, fixed, forbidden, 2, NODE_LIMIT);
    if (!r.aborted && r.solutions.length === 1) {
      const comp = r.solutions[0];
      let best = null, bestScore = Infinity;
      for (const [rr, cc] of comp) {
        if (board[rr][cc] !== 0) continue;
        const empties = regionCells[regionOf[rr][cc]].filter(([x, y]) => board[x][y] === 0).length;
        if (empties < bestScore) { bestScore = empties; best = [rr, cc]; }
      }
      target = best;
    }
  }
  if (target) flashHint(target);
  else toast('暫時搵唔到提示，可能標記有誤');
}
function flashHint(cell) { hintCell = cell; render(); clearTimeout(hintTimer); hintTimer = setTimeout(() => { hintCell = null; render(); }, 2500); }

/* ── 動畫 / UI ── */
let shakeCellPos = null, popCell = null;
function shakeCell(r, c) {
  if (is3DMode()) { shakeCell3D(r, c); return; }
  shakeCellPos = [r, c]; render(); setTimeout(() => { shakeCellPos = null; render(); }, 400);
}
function markPop(r, c) {
  if (is3DMode()) { pendingPop3D = [r, c]; return; }
  popCell = [r, c]; setTimeout(() => { popCell = null; render(); }, 320);
}

function win() {
  stopTimer();
  const timeBonus = Math.max(0, 300 - seconds);
  const total = isCubeMode() ? 6 * cubeN : N;
  const gained = total * 100 + hearts * 50 + timeBonus;
  score += gained;
  if (score > best) { best = score; localStorage.setItem('zooqueens-best', best); }
  const title = isCubeMode() ? '六面全部解完！' : '全部動物返咗屋企！';
  showOverlay('🎉', title, `第 ${level} 關完成 +${gained} 分（用咗 ${document.getElementById('timer').textContent}）。`,
    [['▶️ 下一關', nextLevel, ''], ['🔄 再玩一次', resetLevel, 'ghost']]);
  celebrate();
}
function gameOver() {
  stopTimer();
  showOverlay('💔', '心用晒喇…', '唔緊要，再試一次！', [['🔄 重試', resetLevel, '']]);
}
function showOverlay(emoji, title, text, buttons) {
  document.getElementById('ovEmoji').textContent = emoji;
  document.getElementById('ovTitle').textContent = title;
  document.getElementById('ovText').textContent = text;
  const box = document.getElementById('ovButtons'); box.innerHTML = '';
  for (const [label, fn, extra] of buttons) {
    const b = document.createElement('button'); b.textContent = label;
    if (extra) b.className = extra;
    b.addEventListener('click', fn); box.appendChild(b);
  }
  document.getElementById('overlay').classList.add('show');
}
function hideOverlay() { document.getElementById('overlay').classList.remove('show'); }

function celebrate() {
  const emojis = ['🦁','🐯','🐘','🦓','🐼','🦊'];
  for (let i = 0; i < 24; i++) {
    const s = document.createElement('span');
    s.className = 'confetti';
    s.style.left = (Math.random() * 90 + 5) + 'vw';
    s.style.top = (Math.random() * 40 + 30) + 'vh';
    s.style.animationDelay = (Math.random() * 0.5) + 's';
    if (Math.random() < 0.6) {
      const img = document.createElement('img');
      img.src = is3DMode() ? ('assets/animals/' + ANIMALS_3D[Math.floor(Math.random() * ANIMALS_3D.length)] + '.png') : ANIMAL_IMG;
      img.alt = '';
      img.onerror = () => { s.textContent = emojis[Math.floor(Math.random() * emojis.length)]; };
      s.appendChild(img);
    } else {
      s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    }
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 2400);
  }
}
let toastTimer = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ── 動物圖 element（自訂 image + emoji fallback） ── */
function animalSrcFor(r, c) {
  if (level >= DIFF_ANIMAL_LEVEL) {
    const idx = Math.abs((r * 7 + c * 13) % ANIMALS_3D.length);
    return 'assets/animals/' + ANIMALS_3D[idx] + '.png';
  }
  return ANIMAL_IMG;
}
function animalElement(r, c, pop) {
  const img = document.createElement('img');
  img.className = 'animal-img' + (pop ? ' pop' : '');
  img.src = animalSrcFor(r, c);
  img.alt = '';
  img.draggable = false;
  img.onerror = function () {
    const span = document.createElement('span');
    span.className = 'animal-fallback' + (pop ? ' pop' : '');
    span.textContent = '🦁';
    this.replaceWith(span);
  };
  return img;
}

/* ── 渲染 ── */
const boardEl = document.getElementById('board');
function render2D() {
  boardEl.innerHTML = '';
  boardEl.style.gridTemplateColumns = `repeat(${N}, 1fr)`;
  boardEl.style.gridTemplateRows = `repeat(${N}, 1fr)`;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    const reg = regionOf[r][c];
    cell.style.background = PALETTE[reg % PALETTE.length];
    const st = r > 0 && regionOf[r-1][c] === reg;
    const sb = r < N-1 && regionOf[r+1][c] === reg;
    const sl = c > 0 && regionOf[r][c-1] === reg;
    const sr = c < N-1 && regionOf[r][c+1] === reg;
    const thin = '1px solid rgba(255,255,255,.45)';
    const thick = '2px solid var(--region-border)';
    cell.style.borderTop = st ? thin : thick;
    cell.style.borderBottom = sb ? thin : thick;
    cell.style.borderLeft = sl ? thin : thick;
    cell.style.borderRight = sr ? thin : thick;

    if (board[r][c] === 1) {
      cell.appendChild(animalElement(r, c, popCell && popCell[0] === r && popCell[1] === c));
      if (locked[r][c]) { const lk = document.createElement('span'); lk.className = 'lock'; lk.textContent = '🔒'; cell.appendChild(lk); }
    } else if (board[r][c] === 2) {
      cell.classList.add('x');
      const mark = document.createElement('span'); mark.className = 'mark'; mark.textContent = '✕';
      cell.appendChild(mark);
    }
    if (shakeCellPos && shakeCellPos[0] === r && shakeCellPos[1] === c) cell.classList.add('shake');
    if (hintCell && hintCell[0] === r && hintCell[1] === c) cell.classList.add('hint-pulse');
    cell.addEventListener('click', () => onTap(r, c));
    boardEl.appendChild(cell);
  }
  renderHUD();
}
function renderHUD() {
  renderHearts();
  if (isCubeMode()) {
    const done = cubeFaces.filter(f => {
      let c = 0; for (const row of f.board) for (const v of row) if (v === 1) c++;
      return c === cubeN;
    }).length;
    document.getElementById('level').textContent = `Level ${level} · Cube ${done}/6`;
    document.getElementById('diff').textContent = `${cubeN}×${cubeN}` + (hardMode ? ' 困難' : '');
    document.getElementById('diff').style.color = hardMode ? '#e5484d' : '#4a90d9';
  } else {
    document.getElementById('level').textContent = `Level ${level} · ${N}×${N}` + (is3DMode() ? ' · 3D' : '');
    const d = difficultyFor(N);
    document.getElementById('diff').textContent = d;
    document.getElementById('diff').style.color = DIFF_COLOR[d];
  }
  document.getElementById('score').textContent = score;
  document.getElementById('best').textContent = best;
  const hardBtn = document.getElementById('hard');
  if (hardBtn) {
    hardBtn.style.display = isCubeMode() ? '' : 'none';
    hardBtn.textContent = hardMode ? '🧩 困難' : '🧩 一般';
  }
}
function renderHearts() {
  const h = document.getElementById('hearts'); h.innerHTML = '';
  for (let i = 0; i < START_HEARTS; i++) {
    const s = document.createElement('span');
    s.textContent = '❤️';
    if (i < hearts) s.classList.add('on');
    h.appendChild(s);
  }
}

/* ════════════════════════════════════════════════════════════════
   3D 模式 —— level >= 21 用 Three.js（一平面但立體感）
   ════════════════════════════════════════════════════════════════ */
function is3DMode() { return level >= THREE_D_LEVEL && !g3dFailed; }
function isCubeMode() { return level >= CUBE_LEVEL && !g3dFailed; }

function render() {
  if (isCubeMode()) renderCube();
  else if (is3DMode()) render3D();
  else render2D();
}

function applyModeVisibility() {
  const is3d = is3DMode();
  document.getElementById('board-wrap').classList.toggle('hidden', is3d);
  document.getElementById('board3d').classList.toggle('hidden', !is3d);
  if (is3d && !g3d) ensure3D();
}

function ensure3D() {
  if (g3d || g3dFailed) return !!g3d;
  if (typeof THREE === 'undefined') { g3dFailed = true; return false; }
  const container = document.getElementById('board3d');
  const W = Math.max(280, container.clientWidth);
  const H = Math.max(280, container.clientHeight);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xeef2f8);

  const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 300);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(W, H);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  container.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.9));
  scene.add(new THREE.HemisphereLight(0xffffff, 0x9aa7b8, 0.25));
  const dir = new THREE.DirectionalLight(0xffffff, 0.4);
  dir.position.set(10, 18, 11);
  dir.castShadow = true;
  dir.shadow.mapSize.set(2048, 2048);
  dir.shadow.camera.left = -20; dir.shadow.camera.right = 20;
  dir.shadow.camera.top = 20; dir.shadow.camera.bottom = -20;
  dir.shadow.camera.near = 1; dir.shadow.camera.far = 80;
  dir.shadow.bias = -0.0005;
  scene.add(dir);

  const boardGroup = new THREE.Group();
  scene.add(boardGroup);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.enablePan = false;
  controls.maxPolarAngle = Math.PI * 0.49;
  controls.minPolarAngle = Math.PI * 0.16;

  const texLoader = new THREE.TextureLoader();
  const animalTex = {};
  for (const a of ANIMALS_3D) {
    const t = texLoader.load('assets/animals/' + a + '.png');
    t.minFilter = THREE.LinearFilter;
    t.magFilter = THREE.LinearFilter;
    animalTex[a] = t;
  }

  g3d = {
    scene, camera, renderer, controls, boardGroup, animalTex,
    ray: new THREE.Raycaster(), pointer: new THREE.Vector2(),
    cellMeshes: [], spriteByCell: {}, pops: [],
  };

  window.addEventListener('resize', resize3D);
  bind3DInput(renderer.domElement);

  (function animate() {
    requestAnimationFrame(animate);
    controls.update();
    update3DPops();
    renderer.render(scene, camera);
  })();

  return true;
}

function resize3D() {
  if (!g3d) return;
  const container = document.getElementById('board3d');
  const W = Math.max(280, container.clientWidth);
  const H = Math.max(280, container.clientHeight);
  g3d.camera.aspect = W / H;
  g3d.camera.updateProjectionMatrix();
  g3d.renderer.setSize(W, H);
}

function bind3DInput(dom) {
  let sx = 0, sy = 0, down = false;
  dom.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; down = true; });
  dom.addEventListener('pointerup', e => {
    if (!down) return;
    down = false;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (dx * dx + dy * dy > 36) return;   // 當做 drag/rotate
    const cell = pickCell3D(e, dom);
    if (!cell) return;
    if (isCubeMode()) onTapCube(cell.face, cell.r, cell.c);
    else onTap(cell.r, cell.c);
  });
}

function pickCell3D(e, dom) {
  if (!g3d) return null;
  const rect = dom.getBoundingClientRect();
  g3d.pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  g3d.pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  g3d.ray.setFromCamera(g3d.pointer, g3d.camera);
  const targets = g3d.cubeBody ? [g3d.cubeBody].concat(g3d.cellMeshes) : g3d.cellMeshes;
  const hits = g3d.ray.intersectObjects(targets, false);
  if (!hits.length) return null;
  if (hits[0].object === g3d.cubeBody) return null;   // 射中 cube body（格仔 gap）
  const u = hits[0].object.userData;
  return { face: (u.face === undefined ? -1 : u.face), r: u.r, c: u.c };
}

function fitCamera3D() {
  const radius = (N * Math.SQRT2) / 2;
  const fovRad = g3d.camera.fov * Math.PI / 360;
  const dist = Math.max((radius / Math.tan(fovRad)) * 1.18, 6);
  const elev = 37 * Math.PI / 180, azi = 40 * Math.PI / 180;
  g3d.camera.position.set(
    dist * Math.cos(elev) * Math.sin(azi),
    dist * Math.sin(elev),
    dist * Math.cos(elev) * Math.cos(azi)
  );
  g3d.controls.target.set(0, 0, 0);
  g3d.controls.minDistance = dist * 0.35;
  g3d.controls.maxDistance = dist * 2.8;
  g3d.controls.maxPolarAngle = Math.PI * 0.49;
  g3d.controls.update();
}

function render3D() {
  const g = g3d;
  while (g.boardGroup.children.length) {
    const ch = g.boardGroup.children[0];
    g.boardGroup.remove(ch);
    disposeObj3D(ch);
  }
  g.cellMeshes = [];
  g.spriteByCell = {};
  g.pops = [];

  const off = (N - 1) / 2;
  const tileH = 0.16, gap = 0.06;
  const S = N + 0.6;
  baseY3D = 0;
  g.cubeBody = null;

  const backing = new THREE.Mesh(
    new THREE.BoxGeometry(S, 0.2, S),
    new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9, metalness: 0 })
  );
  backing.position.set(0, -0.1, 0);
  backing.receiveShadow = true;
  g.boardGroup.add(backing);

  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const reg = regionOf[r][c];
    const col = PALETTE[reg % PALETTE.length];
    const m = new THREE.Mesh(
      new THREE.BoxGeometry(1 - gap, tileH, 1 - gap),
      new THREE.MeshStandardMaterial({ color: new THREE.Color(col), roughness: 0.72, metalness: 0.05 })
    );
    m.position.set(c - off, baseY3D + tileH / 2, r - off);
    m.castShadow = true;
    m.receiveShadow = true;
    m.userData = { r, c, reg, base: col };
    g.boardGroup.add(m);
    g.cellMeshes.push(m);
  }

  const bMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.55, metalness: 0 });
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const reg = regionOf[r][c];
    if (c + 1 < N && regionOf[r][c + 1] !== reg) {
      const b = new THREE.Mesh(new THREE.BoxGeometry(gap * 1.5, 0.05, 1), bMat);
      b.position.set(c - off + 0.5, baseY3D + tileH + 0.025, r - off);
      g.boardGroup.add(b);
    }
    if (r + 1 < N && regionOf[r + 1][c] !== reg) {
      const b = new THREE.Mesh(new THREE.BoxGeometry(1, 0.05, gap * 1.5), bMat);
      b.position.set(c - off, baseY3D + tileH + 0.025, r - off + 0.5);
      g.boardGroup.add(b);
    }
  }

  animalIdx3D = 0;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const wx = c - off, wz = r - off;
    if (board[r][c] === 1) {
      addAnimal3D(r, c, wx, wz);
      if (locked[r][c]) addLock3D(wx, wz);
    } else if (board[r][c] === 2) {
      addX3D(wx, wz);
    }
  }

  if (pendingPop3D) {
    const s = g.spriteByCell[pendingPop3D[0] + ',' + pendingPop3D[1]];
    if (s) g.pops.push({ spr: s, t: performance.now(), w: s.scale.x, h: s.scale.y });
    pendingPop3D = null;
  }

  renderHUD();
}

function addX3D(wx, wz) {

function addLock3D(wx, wz) {

function shakeCell3D(r, c) {

    if (m.userData.r === r && m.userData.c === c) m.material.color.set(0xe5484d);
  }
  setTimeout(() => {
    for (const m of g3d.cellMeshes) {
      if (m.userData.r === r && m.userData.c === c) m.material.color.set(m.userData.base);
    }
  }, 400);
}

function update3DPops() {
  if (!g3d) return;
  const now = performance.now();
  for (let i = g3d.pops.length - 1; i >= 0; i--) {
    const p = g3d.pops[i];
    const t = (now - p.t) / 320;
    if (t >= 1) { p.spr.scale.set(p.w, p.h, 1); g3d.pops.splice(i, 1); continue; }
    const s = 0.3 + 0.7 * (1 - Math.pow(1 - t, 3));
    p.spr.scale.set(p.w * s, p.h * s, 1);
  }
}

function disposeObj3D(obj) {
  if (obj.geometry) obj.geometry.dispose();
  if (obj.material) {
    const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
    for (const m of mats) m.dispose();
  }
}

/* ════════════════════════════════════════════════════════════════
   Cube 六面模式 —— level >= 25：六面各自一個 Queens 棋盤
   ════════════════════════════════════════════════════════════════ */
const CUBE_FACE_DEFS = [
  { rot: [0, 0, 0],            pos: [0, 0, 1] },   // front +Z
  { rot: [0, Math.PI, 0],      pos: [0, 0, -1] },  // back  -Z
  { rot: [-Math.PI / 2, 0, 0], pos: [0, 1, 0] },   // top   +Y
  { rot: [Math.PI / 2, 0, 0],  pos: [0, -1, 0] },  // bottom -Y
  { rot: [0, Math.PI / 2, 0],  pos: [1, 0, 0] },   // right +X
  { rot: [0, -Math.PI / 2, 0], pos: [-1, 0, 0] },  // left  -X
];

/* ── 跨面相鄰（困難模式）── */
function cellWorld(f, r, c) {
  const off = (cubeN - 1) / 2;
  const u = c - off, v = r - off;
  const H = (cubeN + 0.6) / 2;
  switch (f) {
    case 0: return { x: u, y: v, z: H };      // front +Z
    case 1: return { x: -u, y: v, z: -H };    // back  -Z
    case 2: return { x: u, y: H, z: -v };     // top   +Y
    case 3: return { x: u, y: -H, z: v };     // bottom -Y
    case 4: return { x: H, y: v, z: -u };     // right +X
    case 5: return { x: -H, y: v, z: u };     // left  -X
  }
  return { x: 0, y: 0, z: 0 };
}
function crossFaceAdjacent(f1, r1, c1, f2, r2, c2) {
  if (f1 === f2) return false;
  const a = cellWorld(f1, r1, c1), b = cellWorld(f2, r2, c2);
  return Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z) < 1.3;
}
function enumerateQueens(n) {
  const sols = [];
  const cols = new Set();
  const placed = [];
  function bt(row) {
    if (row === n) { sols.push(placed.slice()); return; }
    for (let c = 0; c < n; c++) {
      if (cols.has(c)) continue;
      let ok = true;
      for (const [pr, pc] of placed) if (Math.abs(pr - row) <= 1 && Math.abs(pc - c) <= 1) { ok = false; break; }
      if (!ok) continue;
      cols.add(c); placed.push([row, c]);
      bt(row + 1);
      cols.delete(c); placed.pop();
    }
  }
  bt(0);
  return sols;
}
function solveCubePlacement() {
  const perFace = [];
  for (let f = 0; f < 6; f++) {
    const sols = enumerateQueens(cubeN);
    if (!sols.length) return null;
    perFace.push(sols);
  }
  const chosen = new Array(6).fill(-1);
  const crossConflict = (f, solA, g, solB) => {
    for (const [ra, ca] of solA) for (const [rb, cb] of solB) {
      if (crossFaceAdjacent(f, ra, ca, g, rb, cb)) return true;
    }
    return false;
  };
  function bt(f) {
    if (f === 6) return true;
    for (let i = 0; i < perFace[f].length; i++) {
      const sol = perFace[f][i];
      let ok = true;
      for (let g = 0; g < f; g++) if (crossConflict(f, sol, g, perFace[g][chosen[g]])) { ok = false; break; }
      if (!ok) continue;
      chosen[f] = i;
      if (bt(f + 1)) return true;
      chosen[f] = -1;
    }
    return false;
  }
  if (!bt(0)) return null;
  return chosen.map((idx, f) => perFace[f][idx]);
}
function generateCubeHardLevel() {
  cubeN = Math.min(4 + Math.floor((level - 25) / 3), 6);
  for (let attempt = 0; attempt < 40; attempt++) {
    const placement = solveCubePlacement();
    if (!placement) break;
    const faces = [];
    let ok = true;
    for (let f = 0; f < 6; f++) {
      const sol = placement[f];
      const { regionOf, regionCells } = generateRegions(cubeN, sol);
      // 規則：size-1（單格）區域最多 1 個
      if (regionCells.filter(c => c.length === 1).length > 1) { ok = false; break; }
      const r = findSolutions(cubeN, regionOf, regionCells, [], new Set(), 2, NODE_LIMIT);
      if (r.aborted || r.solutions.length !== 1) { ok = false; break; }
      faces.push({
        regionOf, regionCells, solution: sol,
        board: Array.from({ length: cubeN }, () => Array(cubeN).fill(0)),
        locked: Array.from({ length: cubeN }, () => Array(cubeN).fill(false)),
      });
    }
    if (ok) { cubeFaces = faces; return true; }
  }
  toast('困難六面生成失敗，重試中…'); loadLevel(level); return false;
}

function cubeHasCat(f, r, c) {
  const face = cubeFaces[f], b = face.board;
  for (let cc = 0; cc < cubeN; cc++) if (b[r][cc] === 1) return true;
  for (let rr = 0; rr < cubeN; rr++) if (b[rr][c] === 1) return true;
  const reg = face.regionOf[r][c];
  for (const [rr, cc] of face.regionCells[reg]) if (b[rr][cc] === 1) return true;
  for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
    if (!dr && !dc) continue;
    const nr = r + dr, nc = c + dc;
    if (nr >= 0 && nr < cubeN && nc >= 0 && nc < cubeN && b[nr][nc] === 1) return true;
  }
  if (hardMode) {
    for (let f2 = 0; f2 < 6; f2++) {
      if (f2 === f) continue;
      const b2 = cubeFaces[f2].board;
      for (let r2 = 0; r2 < cubeN; r2++) for (let c2 = 0; c2 < cubeN; c2++) {
        if (b2[r2][c2] === 1 && crossFaceAdjacent(f, r, c, f2, r2, c2)) return true;
      }
    }
  }
  return false;
}
function cubePlaceCat(f, r, c) {
  const face = cubeFaces[f];
  if (face.board[r][c] === 1) return;
  const hadX = face.board[r][c] === 2;
  if (hadX) face.board[r][c] = 0;
  if (cubeHasCat(f, r, c)) {
    if (hadX) face.board[r][c] = 2;
    shakeCube(f, r, c); loseHeart(); return;
  }
  pushCubeHistory();
  face.board[r][c] = 1;
  renderCube();
  const s = g3d.spriteByCell[f + ',' + r + ',' + c];
  if (s) g3d.pops.push({ spr: s, t: performance.now(), w: s.scale.x, h: s.scale.y });
  if (cubeIsWon()) win();
}
function cubeRemoveCat(f, r, c) {
  const face = cubeFaces[f];
  if (face.board[r][c] !== 1 || face.locked[r][c]) return;
  pushCubeHistory();
  face.board[r][c] = 0;
  renderCube();
}
function cubeToggleX(f, r, c) {
  const face = cubeFaces[f];
  if (face.board[r][c] === 1) return;
  pushCubeHistory();
  face.board[r][c] = face.board[r][c] === 2 ? 0 : 2;
  renderCube();
}
function cubeIsWon() {
  return cubeFaces.every(f => {
    let c = 0;
    for (const row of f.board) for (const v of row) if (v === 1) c++;
    return c === cubeN;
  });
}
function pushCubeHistory() {
  cubeHistory.push(cubeFaces.map(f => ({ board: f.board.map(r => r.slice()) })));
  if (cubeHistory.length > 300) cubeHistory.shift();
}
function onTapCube(f, r, c) {
  if (cubeFaces[f].locked[r][c]) return;
  touch();
  if (tapTimer) {
    clearTimeout(tapTimer); tapTimer = null;
    if (cubeFaces[f].board[r][c] === 1) cubeRemoveCat(f, r, c);
    else cubePlaceCat(f, r, c);
  } else {
    tapTimer = setTimeout(() => { tapTimer = null; cubeToggleX(f, r, c); }, 250);
  }
}
function shakeCube(f, r, c) {
  for (const m of g3d.cellMeshes) {
    if (m.userData.face === f && m.userData.r === r && m.userData.c === c) m.material.color.set(0xe5484d);
  }
  setTimeout(() => {
    for (const m of g3d.cellMeshes) {
      if (m.userData.face === f && m.userData.r === r && m.userData.c === c) m.material.color.set(m.userData.base);
    }
  }, 400);
}

function renderCube() {
  const g = g3d;
  while (g.boardGroup.children.length) {
    const ch = g.boardGroup.children[0];
    g.boardGroup.remove(ch);
    disposeObj3D(ch);
  }
  g.cellMeshes = [];
  g.spriteByCell = {};
  g.pops = [];

  const S = cubeN + 0.6;
  const gap = 0.06;
  const off = (cubeN - 1) / 2;

  // cube 六面 body + 邊緣線
  const cubeMesh = new THREE.Mesh(
    new THREE.BoxGeometry(S, S, S),
    new THREE.MeshStandardMaterial({ color: 0xf7f9fc, roughness: 0.82, metalness: 0.05 })
  );
  g.boardGroup.add(cubeMesh);
  g.cubeBody = cubeMesh;
  g.boardGroup.add(new THREE.LineSegments(
    new THREE.EdgesGeometry(cubeMesh.geometry),
    new THREE.LineBasicMaterial({ color: 0xc3ccd8 })
  ));

  animalIdx3D = 0;
  for (let f = 0; f < 6; f++) {
    const def = CUBE_FACE_DEFS[f];
    const face = cubeFaces[f];
    const grp = new THREE.Group();
    grp.rotation.set(def.rot[0], def.rot[1], def.rot[2]);
    grp.position.set(def.pos[0] * S / 2, def.pos[1] * S / 2, def.pos[2] * S / 2);
    g.boardGroup.add(grp);

    for (let r = 0; r < cubeN; r++) for (let c = 0; c < cubeN; c++) {
      const reg = face.regionOf[r][c];
      const col = PALETTE[reg % PALETTE.length];
      const u = c - off, v = r - off;
      const m = new THREE.Mesh(
        new THREE.PlaneGeometry(1 - gap, 1 - gap),
        new THREE.MeshStandardMaterial({ color: new THREE.Color(col), roughness: 0.72, metalness: 0.05 })
      );
      m.position.set(u, v, 0.012);
      m.userData = { face: f, r, c, base: col };
      grp.add(m);
      g.cellMeshes.push(m);
    }

    // 區域邊界白線（面內，唔同 region 之間）
    const bMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    for (let r = 0; r < cubeN; r++) for (let c = 0; c < cubeN; c++) {
      const reg = face.regionOf[r][c];
      const u = c - off, v = r - off;
      if (c + 1 < cubeN && face.regionOf[r][c + 1] !== reg) {
        const b = new THREE.Mesh(new THREE.PlaneGeometry(gap * 1.6, 1), bMat);
        b.position.set(u + 0.5, v, 0.02);
        grp.add(b);
      }
      if (r + 1 < cubeN && face.regionOf[r + 1][c] !== reg) {
        const b = new THREE.Mesh(new THREE.PlaneGeometry(1, gap * 1.6), bMat);
        b.position.set(u, v + 0.5, 0.02);
        grp.add(b);
      }
    }

    // 動物 / ✕
    for (let r = 0; r < cubeN; r++) for (let c = 0; c < cubeN; c++) {
      const u = c - off, v = r - off;
      if (face.board[r][c] === 1) addCubeAnimal(grp, f, r, c, u, v);
      else if (face.board[r][c] === 2) addCubeX(grp, u, v);
    }
  }

  renderHUD();
}

function addCubeAnimal(grp, f, r, c, u, v) {
  const kind = ANIMALS_3D[animalIdx3D % ANIMALS_3D.length];
  animalIdx3D++;
  const tex = g3d.animalTex[kind];
  const img = tex.image;
  let aspect = 1;
  if (img && img.width && img.height) aspect = img.height / img.width;
  const bw = 0.7;
  const bh = Math.min(0.9, Math.max(0.45, bw * aspect));
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  spr.scale.set(bw, bh, 1);
  spr.position.set(u, v, 0.2 + bh / 2);
  grp.add(spr);
  g3d.spriteByCell[f + ',' + r + ',' + c] = spr;
}

function addCubeX(grp, u, v) {
  const ov = new THREE.Mesh(
    new THREE.PlaneGeometry(0.94, 0.94),
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.55, depthWrite: false })
  );
  ov.position.set(u, v, 0.03);
  grp.add(ov);
  const xm = new THREE.MeshBasicMaterial({ color: 0x8f969e });
  const len = 0.58, w = 0.07;
  const a = new THREE.Mesh(new THREE.PlaneGeometry(len, w), xm);
  a.position.set(u, v, 0.035); a.rotation.z = Math.PI / 4;
  grp.add(a);
  const b = new THREE.Mesh(new THREE.PlaneGeometry(len, w), xm);
  b.position.set(u, v, 0.035); b.rotation.z = -Math.PI / 4;
  grp.add(b);
}

function fitCameraCube() {
  const S = cubeN + 0.6;
  const radius = (S * Math.sqrt(3)) / 2;
  const fovRad = g3d.camera.fov * Math.PI / 360;
  const dist = Math.max((radius / Math.tan(fovRad)) * 1.25, 6);
  const elev = 30 * Math.PI / 180, azi = 40 * Math.PI / 180;
  g3d.camera.position.set(
    dist * Math.cos(elev) * Math.sin(azi),
    dist * Math.sin(elev),
    dist * Math.cos(elev) * Math.cos(azi)
  );
  g3d.controls.target.set(0, 0, 0);
  g3d.controls.minDistance = dist * 0.5;
  g3d.controls.maxDistance = dist * 3.5;
  g3d.controls.maxPolarAngle = Math.PI;
  g3d.controls.update();
}

/* ── 輸入 ── */
let tapTimer = null;
function onTap(r, c) {
  if (locked[r][c]) return;
  touch();
  if (tapTimer) {
    // double-click → place/remove the animal
    clearTimeout(tapTimer);
    tapTimer = null;
    if (board[r][c] === 1) removeCat(r, c);
    else placeCat(r, c);
  } else {
    // single-click → toggle ✕ (deferred 250ms to detect a double-click)
    tapTimer = setTimeout(() => {
      tapTimer = null;
      toggleX(r, c);
    }, 250);
  }
}

/* ── 按鈕 ── */
document.getElementById('undo').addEventListener('click', undo);
document.getElementById('reset').addEventListener('click', resetLevel);
document.getElementById('hard').addEventListener('click', () => {
  hardMode = !hardMode;
  loadLevel(level);
  toast(hardMode ? '🧩 困難：六面跨面相鄰' : '🧩 一般：六面獨立');
});

/* ── 測試 API（headless） ── */
globalThis.__zooqueens = {
  genPlacement, generateRegions, findSolutions, generateLevel, loadLevel, newGame, nextLevel,
  placeCat, removeCat, toggleX, isValidPlacement, isWon, hint, undo,
  regionOf: () => regionOf.map(r => r.slice()),
  regionCells: () => regionCells.map(a => a.slice()),
  solution: () => solution.map(x => x.slice()),
  starters: () => starters.map(x => x.slice()),
  board: () => board.map(r => r.slice()),
  setBoard: b => { board = b.map(r => r.slice()); },
  hearts: () => hearts,
  N: () => N, level: () => level,
  is3D: () => is3DMode(), g3dReady: () => !!g3d, isCube: () => isCubeMode(),
  THREE_D_LEVEL, DIFF_ANIMAL_LEVEL, CUBE_LEVEL, ANIMALS_3D,
  cubeN: () => cubeN,
  cubeFaces: () => cubeFaces.map(f => ({ board: f.board.map(r => r.slice()), regionOf: f.regionOf.map(r => r.slice()), solution: f.solution.map(x => x.slice()) })),
  cubePlaceCat, cubeIsWon,
  hardMode: () => hardMode, crossFaceAdjacent, solveCubePlacement,
};

// ── 啟動 ──
// URL 跳關：`?level=25` 或 `#25` 直接開指定關卡（例如跳去 3D cube 試玩）
// 困難模式：`?hard=1` 開 cube 跨面相鄰
function urlStartLevel() {
  try {
    const q = new URLSearchParams(location.search).get('level');
    if (q && +q >= 1) return Math.min(999, Math.floor(+q));
    const h = (location.hash || '').match(/^#?(\d+)$/);
    if (h && +h[1] >= 1) return Math.min(999, Math.floor(+h[1]));
  } catch (e) {}
  return null;
}
function urlHardMode() {
  try {
    const q = new URLSearchParams(location.search).get('hard');
    if (q === '1' || q === 'true') return true;
  } catch (e) {}
  return false;
}
(function boot() {
  hardMode = urlHardMode();
  const lv = urlStartLevel();
  if (lv) { score = 0; loadLevel(lv); }
  else newGame();
})();
